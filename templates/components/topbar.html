<header class='h-16 bg-gray-900/50 border-b border-gray-800 px-6 flex items-center justify-between gap-4 backdrop-blur-sm sticky top-0 z-10'>

    <!-- Page title (overridable by child templates) -->
    <h1 class='text-lg font-semibold text-gray-100 truncate'>
        {% block page_title %}Page{% endblock %}
    </h1>

    <!-- Right: user info + logout -->
    <div class='flex items-center gap-3 shrink-0'>

        <!-- User email -->
        <span class='hidden sm:block text-sm text-gray-400 truncate max-w-xs'>
            {{ request.user.email }}
        </span>

        <!-- AI Settings -->
        <a href='{% url "users:settings" %}'
            class='hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium
            {% if request.path == "/users/settings/" %}bg-violet-600/10 text-violet-400{% else %}text-gray-400 hover:bg-gray-800 hover:text-gray-200{% endif %}
            transition-all duration-200'
            title='AI Settings'>
            <svg xmlns='http://www.w3.org/2000/svg' class='h-3.5 w-3.5' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>
                <circle cx='12' cy='12' r='3'/>
                <path d='M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14'/>
            </svg>
            AI Settings
        </a>

        <!-- Password change -->
        <a href='{% url "users:password_change" %}'
            class='hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-gray-400
            hover:bg-gray-800 hover:text-gray-200 transition-all duration-200'
            title='Change password'>
            <svg xmlns='http://www.w3.org/2000/svg' class='h-3.5 w-3.5' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>
                <rect x='3' y='11' width='18' height='11' rx='2' ry='2'/>
                <path d='M7 11V7a5 5 0 0 1 10 0v4'/>
            </svg>
            Password
        </a>

        <!-- Logout -->
        <form method='POST' action='{% url "users:logout" %}'>
            {% csrf_token %}
            <button type='submit'
                class='flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium
                text-gray-400 hover:bg-rose-500/10 hover:text-rose-400
                border border-transparent hover:border-rose-500/20
                transition-all duration-200'>
                <svg xmlns='http://www.w3.org/2000/svg' class='h-3.5 w-3.5' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>
                    <path d='M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4'/>
                    <polyline points='16 17 21 12 16 7'/>
                    <line x1='21' y1='12' x2='9' y2='12'/>
                </svg>
                Logout
            </button>
        </form>

    </div>
</header>
