{% if messages %}
<div class='fixed top-4 right-4 z-50 flex flex-col gap-2 w-full max-w-sm pointer-events-none' aria-live='polite' aria-label='Notifications'>
    {% for message in messages %}
    <div role='alert'
        class='flex items-start gap-3 px-4 py-3 rounded-lg border text-sm shadow-lg pointer-events-auto
        {% if message.tags == "success" %}bg-emerald-500/10 border-emerald-500/20 text-emerald-400
        {% elif message.tags == "error" %}bg-rose-500/10 border-rose-500/20 text-rose-400
        {% elif message.tags == "warning" %}bg-amber-500/10 border-amber-500/20 text-amber-400
        {% else %}bg-sky-500/10 border-sky-500/20 text-sky-400{% endif %}'>

        <!-- Icon -->
        <span class='mt-0.5 shrink-0' aria-hidden='true'>
            {% if message.tags == "success" %}
            <svg xmlns='http://www.w3.org/2000/svg' class='h-4 w-4' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
                <polyline points='20 6 9 17 4 12'/>
            </svg>
            {% elif message.tags == "error" %}
            <svg xmlns='http://www.w3.org/2000/svg' class='h-4 w-4' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
                <circle cx='12' cy='12' r='10'/>
                <line x1='15' y1='9' x2='9' y2='15'/>
                <line x1='9' y1='9' x2='15' y2='15'/>
            </svg>
            {% elif message.tags == "warning" %}
            <svg xmlns='http://www.w3.org/2000/svg' class='h-4 w-4' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
                <path d='M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z'/>
                <line x1='12' y1='9' x2='12' y2='13'/>
                <line x1='12' y1='17' x2='12.01' y2='17'/>
            </svg>
            {% else %}
            <svg xmlns='http://www.w3.org/2000/svg' class='h-4 w-4' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
                <circle cx='12' cy='12' r='10'/>
                <line x1='12' y1='8' x2='12' y2='12'/>
                <line x1='12' y1='16' x2='12.01' y2='16'/>
            </svg>
            {% endif %}
        </span>

        <!-- Message text -->
        <span class='flex-1'>{{ message }}</span>

        <!-- Dismiss button -->
        <button type='button'
            onclick='this.closest("[role=alert]").remove()'
            class='shrink-0 mt-0.5 text-current opacity-60 hover:opacity-100 transition-opacity'
            aria-label='Dismiss notification'>
            <svg xmlns='http://www.w3.org/2000/svg' class='h-4 w-4' viewBox='0 0 20 20' fill='currentColor' aria-hidden='true'>
                <path fill-rule='evenodd' d='M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z' clip-rule='evenodd'/>
            </svg>
        </button>

    </div>
    {% endfor %}
</div>
{% endif %}
