<!DOCTYPE html>
<html>
<head>
    <title>Hackathon Guidelines</title>
    <style>
        body {
            max-width: 900px;
            margin: 40px auto;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }
        pre {
            background: #111;
            color: #eee;
            padding: 12px;
            overflow-x: auto;
        }
        code {
            background: #eee;
            padding: 2px 4px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
        }
    </style>
</head>
<body>
    {{ content|safe }}
</body>
</html>
